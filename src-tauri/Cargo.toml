[package]
name = "easy-csv"
version = "0.4.0"
description = "Handle CSV data in a modular way"
authors = ["tansen"]
edition = "2024"
rust-version = "1.94.0"

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[profile.release]
lto = "thin"
opt-level = "z"
strip = true
debug = false
codegen-units = 1
panic = "abort"

[dependencies]
tauri = { version = "^2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "^2"
tauri-plugin-opener = "^2"
tauri-plugin-dialog = "^2"
tauri-plugin-fs = "^2"
tauri-plugin-window-state = "^2"
tauri-plugin-notification = "^2"
tauri-plugin-http = { version = "^2", features = ["default"] }
tauri-plugin-prevent-default = { version = "^5", features = ["platform-windows"] }
rusqlite = { version = "^0.40.2", features = ["bundled"] }
aes-gcm = "^0.11.0"
sha2 = "^0.11.0"
hex = "^0.4"
rand = "0.8"
hostname = "^0.4"
whoami = "^2.1.2"
dirs = "^6"
csv = "^1.4"
similar = "^3"
encoding_rs = "^0.8"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
tokio = { version = "^1.53.1", features = ["rt", "process"] }
reqwest = { version = "^0.13.4", features = ["json", "stream"] }
futures-util = "0.3"
chrono = "^0.4.45"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
