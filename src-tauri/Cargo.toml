[package]
name = "easy-csv"
version = "0.8.3"
description = "Handle CSV data in a modular way"
authors = ["tansen"]
edition = "2024"
rust-version = "1.94.0"

[[bin]]
name = "EasyCsv"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[profile.release]
lto = "thin"
opt-level = "z"
strip = true
debug = false
codegen-units = 1
panic = "abort"

[dependencies]
tauri = { version = "^2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "^2"
tauri-plugin-opener = "^2"
tauri-plugin-dialog = "^2"
tauri-plugin-fs = "^2"
tauri-plugin-window-state = "^2"
tauri-plugin-notification = "^2"
tauri-plugin-http = { version = "^2", features = ["default"] }
# In-app updates (design 022). `createUpdaterArtifacts` is enabled in
# tauri.conf.json, so release builds REQUIRE a signing key in the environment:
#   TAURI_SIGNING_PRIVATE_KEY (or _PATH) + optional TAURI_SIGNING_PRIVATE_KEY_PASSWORD
tauri-plugin-updater = "^2"
tauri-plugin-process = "^2"
# NOTE: tauri-plugin-prevent-default only exposes the `platform-windows`
# feature (no platform-linux/macos feature exists as of 6.0.1), so the macOS/
# Linux interception ideas from design 012 W4 are not applicable.
# v6 is the first line built against webview2-com 0.39 / windows 0.62, i.e. the
# same COM types tauri 2.12 links against. v5 (webview2-com 0.38 / windows 0.61)
# fails to compile next to tauri >= 2.12: `settings.cast::<ICoreWebView2Settings3>()`
# resolves `cast` from windows-core 0.61 while the interface is a 0.62 type.
tauri-plugin-prevent-default = { version = "^6", features = ["platform-windows"] }
aes-gcm = "^0.11.0"
sha2 = "^0.11.0"
hex = "^0.4"
rand = "0.8"
hostname = "^0.4"
whoami = "^2.1.2"
dirs = "^6"
chrono = "^0.4.45"
csv = "^1.4"
similar = "^3"
encoding_rs = "^0.8"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
tokio = { version = "^1.54.1", features = ["rt", "process", "fs", "io-util"] }
reqwest = { version = "^0.13.5", features = ["json", "stream"] }
rusqlite = { version = "^0.43.0", features = ["bundled"] }
rust_xlsxwriter = "0.102.0"
futures-util = "0.3"
# Plugin catalog verification. Both are already in Cargo.lock via
# tauri-plugin-updater, so promoting them to direct dependencies adds no new
# code to the build:
#   minisign-verify - the same crate the updater uses to check `.sig` assets
#   semver          - comparing an installed plugin version with the catalog's
minisign-verify = "0.2"
semver = "1"

# Test-only: generate minimal xlsx fixtures on the fly. Same
# version already in Cargo.lock via tauri; Stored entries need no extra
# features, so this adds no new crate to the build.
[dev-dependencies]
zip = { version = "4", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
