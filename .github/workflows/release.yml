name: "Release"
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0, 20.15.10

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18

  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: './src-tauri -> target'
          key: ${{ runner.os }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key (design 022). `bundle.createUpdaterArtifacts` is
          # enabled in tauri.conf.json, so a release build FAILS without a valid
          # key here. The generated key has no password, so the password secret
          # may be empty. Rotating this key locks every existing install out of
          # automatic updates — back it up before changing it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "EasyCsv v__VERSION__"
          releaseBody: |
            See the assets to download and install this version.

            In-app updates resolve `latest.json` from GitHub Releases, so this
            release has to be **published** rather than left as a draft: assets
            of a draft are not served by `/releases/latest/download/`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Generates `latest.json` and uploads it (plus the .sig files) as
          # release assets. That asset IS the updater's update source: the app
          # reads `.../releases/latest/download/latest.json`. It is on by
          # default; kept explicit because a silent regression here would only
          # show up as "no updates ever" in the field. See design 022 §4.5.
          uploadUpdaterJson: true

      # `createUpdaterArtifacts` silently produces nothing when no key reaches
      # the bundler, which is only noticed much later as updates that fail
      # signature verification. Fail the release instead. The bundle layout
      # differs per platform/target, so search the whole target directory.
      - name: Verify updater artifacts
        shell: bash
        run: |
          echo "Updater artifacts produced by this build:"
          find src-tauri/target -name '*.sig' -not -path '*/deps/*' -print
          if ! find src-tauri/target -name '*.sig' -not -path '*/deps/*' | grep -q .; then
            echo "::error::No .sig produced. createUpdaterArtifacts is enabled, so the signing key is missing or invalid (check TAURI_PRIVATE_KEY)."
            exit 1
          fi