name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Note: github retired Intel macOS runners, so macOS uses a single
      # Apple-Silicon (arm64) runner that also cross-compiles x86_64 via
      # `--target x86_64-apple-darwin`.
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Cross-compile target only relevant on macOS (currently empty otherwise).
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      # Build the frontend so `cargo test` (which compiles the bin and invokes
      # tauri::generate_context!) can find ../dist. `tauri build` regenerates it
      # anyway via beforeBuildCommand, but this keeps the standalone test step green.
      - name: Build frontend
        run: pnpm build

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build release (Tauri)
        shell: bash
        run: |
          pnpm tauri build
          # macOS: also cross-compile Intel so one runner yields both archs.
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm tauri build --target x86_64-apple-darwin
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyCsv-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/x86_64-apple-darwin/release/bundle/**
          if-no-files-found: warn