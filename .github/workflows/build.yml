name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Note: github retired Intel macOS runners, so macOS uses a single
      # Apple-Silicon (arm64) runner that also cross-compiles x86_64 via
      # `--target x86_64-apple-darwin`.
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Cross-compile target only relevant on macOS (currently empty otherwise).
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.15.0 --activate

      - uses: pnpm/action-setup@v4
        with:
          # Pinned, NOT `latest`. `pnpm-lock.yaml` is `lockfileVersion: 9.0`;
          # `latest` silently moved to pnpm 12, whose `--frozen-lockfile`
          # refuses that format — which is what broke this workflow on all
          # three platforms at "Install frontend dependencies" (2026-09-26).
          # Keep in sync with package.json's `packageManager`.
          version: 10.15.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      # Same workaround as release.yml: the bundler downloads AppRun and
      # linuxdeploy from GitHub's `releases/download` endpoint, which returned
      # 504 on 2026-11-08. The API asset endpoint still serves them; seeding
      # `~/.cache/tauri` makes the bundler reuse those files.
      - name: Seed AppImage bundler tools (ubuntu only)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cache="$HOME/.cache/tauri"
          mkdir -p "$cache"

          fetch_asset() {
            local repo="$1" tag="$2" name="$3" dest="$4" id
            id=$(gh api "repos/$repo/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$name\") | .id")
            [ -n "$id" ] || { echo "::error::Asset $name not found in $repo@$tag"; exit 1; }
            curl -fsSL --retry 5 --retry-delay 3 \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/assets/$id" -o "$dest"
            chmod +x "$dest"
          }

          [ -f "$cache/AppRun-x86_64" ] ||
            fetch_asset tauri-apps/binary-releases apprun-old \
              AppRun-x86_64 "$cache/AppRun-x86_64"

          base="$cache/linuxdeploy-x86_64.AppImage"
          [ -f "$base" ] ||
            fetch_asset tauri-apps/binary-releases linuxdeploy \
              linuxdeploy-x86_64.AppImage "$base"
          cp -f "$base" "$cache/linuxdeploy-07333c6-x86_64.AppImage"

      # Same 504 workaround for the Windows NSIS toolset (`nsis-3.11.zip`). The
      # bundler skips its download when `%LOCALAPPDATA%\tauri\NSIS` already
      # holds the required files, so seed that cache from the API endpoint.
      - name: Seed NSIS toolset (windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:LOCALAPPDATA 'tauri\NSIS'

          # fetch_asset <repo> <tag> <asset name> <destination>
          function Fetch-Asset {
            param([string]$Repo, [string]$Tag, [string]$Name, [string]$Dest)
            $rel = gh api "repos/$Repo/releases/tags/$Tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "gh api failed for $Repo@$Tag" }
            $asset = $rel.assets | Where-Object { $_.name -eq $Name } |
              Select-Object -First 1
            if (-not $asset) { throw "asset $Name not found in $Repo@$Tag" }
            curl.exe -fsSL --retry 5 --retry-delay 3 `
              -H 'Accept: application/octet-stream' `
              -H "Authorization: Bearer $env:GH_TOKEN" `
              "https://api.github.com/repos/$Repo/releases/assets/$($asset.id)" -o $Dest
            if ($LASTEXITCODE -ne 0) { throw "download failed: $Name" }
          }

          # Mirrors tauri-bundler's NSIS_REQUIRED_FILES. If any is missing the
          # bundler deletes the cache and downloads again (and hits the 504),
          # so rebuild the whole toolset instead of patching it.
          $required = @(
            'makensis.exe'
            'Bin/makensis.exe'
            'Stubs/lzma-x86-unicode'
            'Stubs/lzma_solid-x86-unicode'
            'Plugins/x86-unicode/additional/nsis_tauri_utils.dll'
            'Include/MUI2.nsh'
            'Include/FileFunc.nsh'
            'Include/x64.nsh'
            'Include/nsDialogs.nsh'
            'Include/WinMessages.nsh'
            'Include/Win/COM.nsh'
            'Include/Win/Propkey.nsh'
            'Include/Win/RestartManager.nsh'
          )
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $cache $_)) })
          if ($missing.Count -gt 0) {
            Write-Host "missing: $($missing -join ', ')"
            if (Test-Path $cache) { Remove-Item $cache -Recurse -Force }
            $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
            Fetch-Asset 'tauri-apps/binary-releases' 'nsis-3.11' 'nsis-3.11.zip' $zip
            $sha1 = (Get-FileHash $zip -Algorithm SHA1).Hash
            if ($sha1 -ne 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D') {
              throw "nsis-3.11.zip SHA1 mismatch: $sha1"
            }
            $extract = Join-Path $env:RUNNER_TEMP 'nsis-extract'
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            New-Item -ItemType Directory -Force -Path (Split-Path $cache) | Out-Null
            Move-Item (Join-Path $extract 'nsis-3.11') $cache
          }

          # Downloaded separately by the bundler and SHA1-verified by it.
          $dll = Join-Path $cache 'Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          if (-not (Test-Path $dll)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $dll) | Out-Null
            Fetch-Asset 'tauri-apps/nsis-tauri-utils' 'nsis_tauri_utils-v0.5.3' `
              'nsis_tauri_utils.dll' $dll
            $sha1 = (Get-FileHash $dll -Algorithm SHA1).Hash
            if ($sha1 -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') {
              throw "nsis_tauri_utils.dll SHA1 mismatch: $sha1"
            }
          }

          Write-Host "NSIS toolset ready at $cache"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 019 §6 stage 4.2 / 005 B: lint + typecheck gate before anything else,
      # so a broken refactor fails fast instead of at cargo test time.
      - name: Lint frontend
        run: pnpm lint

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Check module index paths
        run: pnpm check:index

      - name: Run frontend tests
        run: pnpm test

      # Build the frontend so `cargo test` (which compiles the bin and invokes
      # tauri::generate_context!) can find ../dist. `tauri build` regenerates it
      # anyway via beforeBuildCommand, but this keeps the standalone test step green.
      - name: Build frontend
        run: pnpm build

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build release (Tauri)
        shell: bash
        run: |
          # This job is a build gate, not a release: no signing key is available
          # here (fork PRs never get secrets). `createUpdaterArtifacts: true` in
          # tauri.conf.json makes the bundler abort with "a public key has been
          # found, but no private key" unless it is turned off for this run.
          NO_UPDATER='{"bundle":{"createUpdaterArtifacts":false}}'
          pnpm tauri build --config "$NO_UPDATER"
          # macOS: also cross-compile Intel so one runner yields both archs.
          if [ "$RUNNER_OS" = "macOS" ]; then
            pnpm tauri build --target x86_64-apple-darwin --config "$NO_UPDATER"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EasyCsv-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/x86_64-apple-darwin/release/bundle/**
          if-no-files-found: warn